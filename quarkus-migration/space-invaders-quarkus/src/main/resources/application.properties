# Quarkus Configuration for Space Invaders

# Disable banner for cleaner output
quarkus.banner.enabled=false

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."net.beeland.spaceinvaders".level=DEBUG

# Disable HTTP server completely (we don't need it for a game)
quarkus.http.host-enabled=false
quarkus.http.test-port=-1

# Shutdown timeout
quarkus.shutdown.timeout=10s

# JVM arguments for LWJGL on macOS (required for GLFW)
# Note: These are applied when running with mvn quarkus:dev or mvn quarkus:run
quarkus.args=-XstartOnFirstThread
